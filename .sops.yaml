creation_rules:
  - path_regex: k8s/secrets.yaml
    # Only the values are encrypted, so the file stays reviewable in a diff:
    # you can see that a key changed without being able to read it.
    encrypted_regex: ^(data|stringData)$
    # The shared ruscan age key, which Flux holds in-cluster as
    # `ruscan-sops-age`, plus the local dev key so the file can be decrypted
    # and edited without the cluster.
    age: >-
      age10d00xrpljw4cga37ad0gt7se4nsehp5uv8yy3grkfqygd4pzyffqj3gr46,
      age1sh4gkd6vtq97pl0fwc43mfq5sh5f0a92t2zm8ktk5h3fln0cs43qfpgm3t
