name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      # This includes test/offline, which builds the binary and runs it against
      # a fake Bot API server. It needs no network and no API keys.
      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
